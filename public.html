<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Pública — SpinScore</title>
  <meta name="theme-color" content="#0D2818">
  <link rel="icon" href="images/Logo.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap');
    :root { --bg:#0D2818;--surface:#163524;--card:#1E4A30;--accent:#F5C518;--red:#E63946;--blue:#4FC3F7;--green:#22C55E;--text:#F0F4F0;--muted:#8BAF94;--border:#2A5C3A;--win:#22C55E; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh; }
    .orb { font-family:'Orbitron',monospace;font-weight:900; }
    nav { display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10; }
    .nav-brand { text-decoration:none;font-family:'Orbitron',monospace;font-size:16px;color:var(--accent);letter-spacing:2px; }
    .badge-live { background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.4);color:#E63946;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px; }
    .dot-live { width:6px;height:6px;border-radius:50%;background:#E63946;animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

    .hero { padding:32px 24px 16px;text-align:center; }
    .torneo-name { font-size:28px;font-weight:800;margin-bottom:4px; }
    .torneo-meta { font-size:13px;color:var(--muted); }

    /* Tabs de grupos */
    .group-tabs { display:flex;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 16px;gap:4px; }
    .group-tabs::-webkit-scrollbar { display:none; }
    .gtab { padding:10px 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s; }
    .gtab.active { color:var(--accent);border-color:var(--accent); }

    .content { max-width:1000px;margin:0 auto;padding:24px 16px; }

    /* Group table */
    .group-card { background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden; }
    .group-header { padding:12px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border); }
    .gbadge { width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0D2818;flex-shrink:0; }
    .gplayer { display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:14px; }
    .gplayer:last-child { border-bottom:none; }
    .gplayer-num { width:24px;color:var(--muted);font-size:12px; }
    .gplayer-name { flex:1;font-weight:500; }
    .gstats { display:flex;gap:12px;font-size:12px;color:var(--muted); }
    .gstat-g { color:var(--win);font-weight:700; }
    .gstat-p { color:var(--red);font-weight:700; }

    /* Match rows */
    .match-row { display:flex;align-items:center;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:6px; }
    .match-p { flex:1;font-size:13px;font-weight:600; }
    .match-p.win { color:var(--win); }
    .match-score { font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:var(--muted);padding:0 10px; }
    .match-score.done { color:var(--text); }
    .match-pending { color:var(--border);font-style:italic; }

    /* Bracket elim */
    .round-title { font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:20px 0 10px; }
    .elim-match { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px; }
    .elim-player { display:flex;align-items:center;padding:6px 0;gap:8px; }
    .elim-player:first-child { border-bottom:1px solid var(--border); }
    .elim-name { flex:1;font-size:14px;font-weight:600; }
    .elim-name.winner { color:var(--win); }
    .elim-name.tbd { color:var(--border);font-style:italic; }
    .elim-sets { font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--muted); }
    .elim-sets.winner { color:var(--text); }
    .elim-detail { font-size:11px;color:var(--border);text-align:center;margin-top:4px; }

    /* Podio */
    .podio-card { display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:10px; }
    .podio-sym { font-size:28px;width:38px;text-align:center; }
    .podio-name { font-size:16px;font-weight:700; }
    .podio-pos { font-size:12px;color:var(--muted);margin-top:2px; }
    .gold-card { border-color:rgba(245,197,24,.5);background:rgba(245,197,24,.07); }

    /* Refresh */
    .refresh-bar { text-align:center;padding:10px;font-size:12px;color:var(--muted); }

    /* Extras */
    .ghead { font-size:10px;color:var(--muted);font-weight:700;padding-top:6px;padding-bottom:6px; }
    .ghead .gplayer-name { font-weight:700; }
    .gstats span { min-width:28px;text-align:center; }
    .gplayer.pass { background:rgba(34,197,94,.06); }
    .gplayer.pass .gplayer-num { color:var(--win); }
    .gplayer-name.top { font-weight:600; }
    .gplayer-name.small { font-size:13px; }
    .gdone { margin-left:auto;font-size:11px;color:var(--win); }
    .sub-title { font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px; }
    .score-blue { color:var(--blue) !important; }
    .score-red { color:var(--red) !important; }
    .dash { color:var(--muted);padding:0 4px; }
    .text-right { text-align:right; }
    .match-detail { font-size:11px;color:var(--muted);text-align:center;margin:-2px 0 6px; }
    .advance { background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:12px 16px;font-size:13px;margin-top:8px; }
    .btn-elim { width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:14px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px; }
    .elim-match.bye { opacity:.6; }
    .podio-title { margin-top:24px; }
    .gplayer-name, .match-p, .elim-name { overflow-wrap:anywhere;min-width:0; }

    /* Empty */
    .empty { text-align:center;padding:60px 20px;color:var(--muted); }

    @media print {
      nav,.refresh-bar { display:none; }
      body { background:#fff;color:#000; }
    }
  </style>
</head>
<body>
<nav>
  <a href="app.html" class="nav-brand">SPINSCORE</a>
  <span class="badge-live"><span class="dot-live"></span> Vista Pública</span>
</nav>

<div class="hero">
  <div class="torneo-name" id="pub-name">Cargando torneo...</div>
  <div class="torneo-meta" id="pub-meta"></div>
</div>

<div class="group-tabs" id="pub-tabs"></div>
<div class="content" id="pub-content"></div>
<div class="refresh-bar" id="pub-refresh"></div>

<script src="js/utils.js"></script>
<script src="js/rules.js"></script>
<script>
const GROUP_COLORS = ['#4FC3F7','#F5C518','#E63946','#22C55E','#A78BFA','#FB923C','#F472B6','#34D399'];
const GROUP_NAMES  = ['A','B','C','D','E','F','G','H'];
const ROUND_NAMES  = ['Dieciseisavos','Octavos de Final','Cuartos de Final','Semifinal','Final'];
const REFRESH_MS   = 30000;

let currentTab = 0;
let data = null;
let fromLink = false;

/**
 * Fuente de datos:
 *  - #hash → torneo compartido por link (funciona en cualquier dispositivo; es una foto del momento).
 *  - ?id=  → torneo guardado en este navegador (se refresca solo cada 30 s).
 */
async function loadData() {
  const hash = location.hash.slice(1);
  if (hash) {
    fromLink = true;
    try { data = await decodeShare(hash); } catch { data = null; }
  } else {
    const all = readJSON('spinscore_torneos', []);
    const id = new URLSearchParams(location.search).get('id');
    data = (id ? all.find(t => t.id === id) : all.find(t => t.status === 'active')) || null;
  }
  render();
  if (!fromLink) setTimeout(loadData, REFRESH_MS);
}

function render() {
  const refresh = document.getElementById('pub-refresh');
  if (!data) {
    document.getElementById('pub-name').textContent = 'Torneo no encontrado';
    document.getElementById('pub-content').innerHTML = fromLink
      ? '<div class="empty">El link está incompleto o dañado.<br>Pide que te lo compartan de nuevo desde SpinScore.</div>'
      : '<div class="empty">No se encontró ningún torneo activo en este dispositivo.<br>Abre la app y usa “Compartir link” desde un torneo.</div>';
    refresh.textContent = '';
    return;
  }
  document.title = `${data.name} — SpinScore`;
  document.getElementById('pub-name').textContent = data.name;
  const fmt = data.cfg ? ` · Al mejor de ${data.cfg.sets} · ${data.cfg.pts} pts` : '';
  document.getElementById('pub-meta').textContent =
    `${data.players.length} jugadores · ${data.phase === 'elimination' ? 'Fase Eliminatoria' : 'Fase de Grupos'}${fmt}`;
  refresh.textContent = fromLink
    ? (data.sharedAt ? `📸 Estado al ${new Date(data.sharedAt).toLocaleString('es-CL')} · pide un link nuevo para ver resultados posteriores` : '')
    : '🔄 Esta página se actualiza cada 30 segundos';

  const groups = data.groups || [];
  const tabs = document.getElementById('pub-tabs');
  if (groups.length) {
    const hasElim = (data.elimRounds || []).length > 0;
    const maxTab = groups.length + (hasElim ? 1 : 0);
    if (currentTab > maxTab) currentTab = 0;
    tabs.innerHTML = groups.map((_, gi) =>
      `<button class="gtab${gi === currentTab ? ' active' : ''}" onclick="switchTab(${gi})">Grupo ${GROUP_NAMES[gi]}</button>`
    ).join('') +
    `<button class="gtab${currentTab === groups.length ? ' active' : ''}" onclick="switchTab(${groups.length})">General</button>` +
    (hasElim ? `<button class="gtab${currentTab === groups.length + 1 ? ' active' : ''}" onclick="switchTab(${groups.length + 1})">Eliminatoria</button>` : '');
  } else { tabs.innerHTML = ''; }

  renderContent();
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.gtab').forEach((t, i) => t.classList.toggle('active', i === idx));
  renderContent();
}

function renderContent() {
  const c = document.getElementById('pub-content');
  if (!data) return;
  const groups = data.groups || [];
  if (data.elimRounds?.length && currentTab === groups.length + 1) { renderElim(c); return; }
  if (currentTab === groups.length) { renderGeneral(c); return; }
  renderGroup(c, currentTab);
}

function calcStats(gi) {
  return rankPlayers(data.groups[gi], (data.groupMatches || []).filter(m => m.groupIdx === gi));
}

const pname = i => esc(data.players[i]);

function renderGroup(c, gi) {
  const stats = calcStats(gi);
  const matches = (data.groupMatches || []).filter(m => m.groupIdx === gi);
  const allDone = matches.every(m => m.done);

  let html = `<div class="group-card">
    <div class="group-header"><div class="gbadge" style="background:${GROUP_COLORS[gi]};">G${GROUP_NAMES[gi]}</div> Grupo ${GROUP_NAMES[gi]}</div>
    <div class="gplayer ghead">
      <div class="gplayer-num">#</div><div class="gplayer-name">JUGADOR</div>
      <div class="gstats"><span>PTS</span><span>G</span><span>P</span><span>SETS</span></div>
    </div>`;
  stats.forEach((s, rank) => {
    const pass = rank < 2 && allDone;
    html += `<div class="gplayer${pass ? ' pass' : ''}">
      <div class="gplayer-num">${rank + 1}${pass ? '*' : ''}</div>
      <div class="gplayer-name${rank < 2 ? ' top' : ''}">${pname(s.idx)}</div>
      <div class="gstats">
        <span>${s.pts}</span>
        <span class="gstat-g">${s.won}</span>
        <span class="gstat-p">${s.lost}</span>
        <span>${s.setW}-${s.setL}</span>
      </div>
    </div>`;
  });
  html += `</div><div class="sub-title">Partidos</div>`;

  matches.forEach(m => {
    const w = m.done ? (m.sets1 > m.sets2 ? 'p1' : 'p2') : null;
    const detail = m.done ? (m.setScores || []).map(([a, b]) => `${a}-${b}`).join(' | ') : '';
    html += `<div class="match-row">
      <div class="match-p${w === 'p1' ? ' win' : ''}">${pname(m.p1)}</div>
      ${m.done
        ? `<div class="match-score done score-blue">${m.sets1}</div><span class="dash">–</span><div class="match-score done score-red">${m.sets2}</div>`
        : `<div class="match-score"><span class="match-pending">vs</span></div>`}
      <div class="match-p text-right${w === 'p2' ? ' win' : ''}">${pname(m.p2)}</div>
    </div>
    ${detail ? `<div class="match-detail">${detail}</div>` : ''}`;
  });

  if (allDone) {
    const top2 = stats.slice(0, 2).map(s => pname(s.idx));
    html += `<div class="advance">Clasifican: <b>${top2.join(' y ')}</b></div>`;
  }
  c.innerHTML = html;
}

function renderGeneral(c) {
  let html = '';
  data.groups.forEach((_, gi) => {
    const stats = calcStats(gi);
    const done = (data.groupMatches || []).filter(m => m.groupIdx === gi).every(m => m.done);
    html += `<div class="group-card">
      <div class="group-header"><div class="gbadge" style="background:${GROUP_COLORS[gi]};">G${GROUP_NAMES[gi]}</div>Grupo ${GROUP_NAMES[gi]}${done ? '<span class="gdone">✓ Completo</span>' : ''}</div>`;
    stats.forEach((s, rank) => {
      const pass = rank < 2 && done;
      html += `<div class="gplayer${pass ? ' pass' : ''}">
        <div class="gplayer-num">${rank + 1}${pass ? '*' : ''}</div>
        <div class="gplayer-name small${rank < 2 ? ' top' : ''}">${pname(s.idx)}</div>
        <div class="gstats"><span class="gstat-g">${s.won}G</span><span class="gstat-p">${s.lost}P</span><span>${s.pts}pts</span></div>
      </div>`;
    });
    html += `</div>`;
  });
  if (data.elimRounds?.length) {
    html += `<button class="btn-elim" onclick="switchTab(${data.groups.length + 1})">Ver Cuadro Eliminatorio →</button>`;
  }
  c.innerHTML = html;
}

function slot(n) {
  if (n === 'BYE') return { html: 'BYE', cls: ' tbd' };
  if (!n || n === 'TBD') return { html: 'Por definir', cls: ' tbd' };
  return { html: esc(n), cls: '' };
}

function renderElim(c) {
  const rounds = data.elimRounds || [], total = rounds.length;
  let html = '';
  rounds.forEach((round, ri) => {
    const fe = total - 1 - ri;
    html += `<div class="round-title">${fe < ROUND_NAMES.length ? ROUND_NAMES[ROUND_NAMES.length - 1 - fe] : `Ronda ${ri + 1}`}</div>`;
    round.forEach(m => {
      const n1 = slot(m.p1name), n2 = slot(m.p2name);
      if (m.bye) {
        html += `<div class="elim-match bye"><div class="elim-player"><div class="elim-name winner">${n1.html}</div><div class="elim-sets">→</div></div><div class="elim-detail">Pasa directo (BYE)</div></div>`;
        return;
      }
      const w1 = m.done && m.sets1 > m.sets2, w2 = m.done && m.sets2 > m.sets1;
      const detail = m.done ? (m.setScores || []).map(([a, b]) => `${a}-${b}`).join(' | ') : '';
      html += `<div class="elim-match">
        <div class="elim-player"><div class="elim-name${w1 ? ' winner' : n1.cls}">${n1.html}</div><div class="elim-sets${w1 ? ' winner' : ''}">${m.done ? m.sets1 : '–'}</div></div>
        <div class="elim-player"><div class="elim-name${w2 ? ' winner' : n2.cls}">${n2.html}</div><div class="elim-sets${w2 ? ' winner' : ''}">${m.done ? m.sets2 : '–'}</div></div>
        ${detail ? `<div class="elim-detail">${detail}</div>` : ''}
      </div>`;
    });
  });
  if (data.podio?.length) {
    html += `<div class="round-title podio-title">Podio Final</div>`;
    const medals = [
      { cls: 'gold-card', sym: '🥇', label: '1° Lugar' },
      { cls: '', sym: '🥈', label: '2° Lugar' },
      { cls: '', sym: '🥉', label: '3° Lugar' },
      { cls: '', sym: '🥉', label: '3° Lugar' },
    ];
    data.podio.slice(0, 4).forEach((n, i) => {
      const m = medals[i];
      html += `<div class="podio-card ${m.cls}"><div class="podio-sym">${m.sym}</div><div><div class="podio-name">${esc(n)}</div><div class="podio-pos">${m.label}</div></div></div>`;
    });
  }
  c.innerHTML = html;
}

window.addEventListener('hashchange', () => { currentTab = 0; loadData(); });
applyVersionLabels();
loadData();
</script>
</body>
</html>
