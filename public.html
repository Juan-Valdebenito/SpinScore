<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Los datos de esta página vienen de links de terceros: solo corre código propio y no envía datos a ningún sitio. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Pública — SpinScore</title>
  <meta name="description" content="Resultados del torneo en vivo: grupos, cuadro eliminatorio y podio.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SpinScore">
  <meta property="og:locale" content="es_CL">
  <meta property="og:url" content="https://spinscore.cl/public.html">
  <meta property="og:title" content="Resultados del torneo — SpinScore">
  <meta property="og:description" content="Mira grupos, cuadro eliminatorio y podio del torneo. Solo lectura.">
  <meta property="og:image" content="https://spinscore.cl/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://spinscore.cl/images/og-image.jpg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#0D2818">
  <link rel="icon" href="images/favicon.ico" sizes="48x48">
  <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700;900&display=swap');
    :root { --bg:#0D2818;--surface:#163524;--card:#1E4A30;--accent:#F5C518;--red:#E63946;--blue:#4FC3F7;--green:#22C55E;--text:#F0F4F0;--muted:#9DBFA5;--red-text:#FF8F97;--border:#2A5C3A;--win:#3DDC79; }
    [data-theme="dark"] { --bg:#050A0F;--surface:#0D1520;--card:#162030;--accent:#C4B5FD;--red:#F87171;--blue:#38BDF8;--green:#34D399;--text:#F1F5F9;--muted:#94A3B8;--red-text:#FB8A8A;--border:#1E3A5F;--win:#34D399; }
    [data-theme="light"] { --bg:#F4F7F4;--surface:#FFF;--card:#EEF4EE;--accent:#176F37;--red:#DC2626;--blue:#0369A1;--green:#16A34A;--text:#1A2E1A;--muted:#4B6B4B;--red-text:#C81E1E;--border:#C8DEC8;--win:#166534; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;min-height:100vh; }
    .orb { font-family:'Orbitron',monospace;font-weight:900; }
    nav { display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10; }
    .nav-brand { text-decoration:none;font-family:'Orbitron',monospace;font-size:16px;color:var(--accent);letter-spacing:2px; }
    .badge-live { background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.4);color:var(--red-text);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px; }
    .dot-live { width:6px;height:6px;border-radius:50%;background:#E63946;animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

    .hero { padding:32px 24px 16px;text-align:center; }
    .torneo-name { font-size:28px;font-weight:800;margin-bottom:4px; }
    .torneo-meta { font-size:13px;color:var(--muted); }

    /* Tabs de grupos */
    .group-tabs { display:flex;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 16px;gap:4px; }
    .group-tabs::-webkit-scrollbar { display:none; }
    .gtab { padding:10px 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s; }
    .gtab.active { color:var(--accent);border-color:var(--accent); }

    .content { max-width:1000px;margin:0 auto;padding:24px 16px; }

    /* Group table */
    .group-card { background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden; }
    .group-header { padding:12px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border); }
    .gbadge { width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0D2818;flex-shrink:0; }
    .gplayer { display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:14px; }
    .gplayer:last-child { border-bottom:none; }
    .gplayer-num { width:24px;color:var(--muted);font-size:12px; }
    .gplayer-name { flex:1;font-weight:500; }
    .gstats { display:flex;gap:12px;font-size:12px;color:var(--muted); }
    .gstat-g { color:var(--win);font-weight:700; }
    .gstat-p { color:var(--red-text);font-weight:700; }

    /* Match rows */
    .match-row { display:flex;align-items:center;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:6px; }
    .match-p { flex:1;font-size:13px;font-weight:600; }
    .match-p.win { color:var(--win); }
    .match-score { font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:var(--muted);padding:0 10px; }
    .match-score.done { color:var(--text); }
    .match-pending { color:var(--muted);font-style:italic; }

    /* Bracket elim */
    .round-title { font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:20px 0 10px; }
    .elim-match { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px; }
    .elim-player { display:flex;align-items:center;padding:6px 0;gap:8px; }
    .elim-player:first-child { border-bottom:1px solid var(--border); }
    .elim-name { flex:1;font-size:14px;font-weight:600; }
    .elim-name.winner { color:var(--win); }
    .elim-name.tbd { color:var(--muted);font-style:italic; }
    .elim-sets { font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--muted); }
    .elim-sets.winner { color:var(--text); }
    .elim-detail { font-size:12px;color:var(--muted);text-align:center;margin-top:4px; }

    /* Podio */
    .podio-card { display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:10px; }
    .podio-sym { font-size:28px;width:38px;text-align:center; }
    .podio-name { font-size:16px;font-weight:700; }
    .podio-pos { font-size:12px;color:var(--muted);margin-top:2px; }
    .gold-card { border-color:rgba(245,197,24,.5);background:rgba(245,197,24,.07); }

    /* Refresh */
    .refresh-bar { text-align:center;padding:10px;font-size:12px;color:var(--muted); }

    /* Extras */
    .ghead { font-size:12px;color:var(--muted);font-weight:700;padding-top:6px;padding-bottom:6px; }
    .ghead .gplayer-name { font-weight:700; }
    .gstats span { min-width:28px;text-align:center; }
    .gplayer.pass { background:rgba(34,197,94,.06); }
    .gplayer.pass .gplayer-num { color:var(--win); }
    .gplayer.previa { background:rgba(245,197,24,.07); }
    .gplayer.previa .gplayer-num { color:var(--accent); }
    .gplayer-name.top { font-weight:600; }
    .gplayer-name.small { font-size:13px; }
    .gdone { margin-left:auto;font-size:12px;color:var(--win); }
    .sub-title { font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px; }
    .score-blue { color:var(--blue) !important; }
    .score-red { color:var(--red-text) !important; }
    .dash { color:var(--muted);padding:0 4px; }
    .text-right { text-align:right; }
    .match-detail { font-size:12px;color:var(--muted);text-align:center;margin:-2px 0 6px; }
    .advance { background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:12px 16px;font-size:13px;margin-top:8px; }
    .btn-elim { width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:14px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px; }
    .elim-match.bye { background:transparent;border-style:dashed; }
    .podio-title { margin-top:24px; }
    .gplayer-name, .match-p, .elim-name { overflow-wrap:anywhere;min-width:0; }

    /* Medallas (reemplazan emojis) */
    .medal { display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:19px;color:#0D2818; }
    .medal-1 { background:#F5C518; } .medal-2 { background:#C9D1DC; } .medal-3 { background:#D98C4A; }

    /* Números con cero sin barra */
    .match-score, .elim-sets { font-family:'Chakra Petch','Orbitron',sans-serif;font-weight:700;font-variant-numeric:tabular-nums; }

    /* Áreas táctiles mínimas de 44 px */
    .gtab { min-height:44px; }
    .nav-brand { display:inline-flex;align-items:center;min-height:44px; }

    /* Empty */
    .empty { text-align:center;padding:60px 20px;color:var(--muted); }

    @media print {
      nav,.refresh-bar { display:none; }
      body { background:#fff;color:#000; }
    }
  </style>
</head>
<body>
<nav>
  <a href="app.html" class="nav-brand">SPINSCORE</a>
  <span class="badge-live"><span class="dot-live"></span> Vista Pública</span>
</nav>

<div class="hero">
  <div class="torneo-name" id="pub-name">Cargando torneo...</div>
  <div class="torneo-meta" id="pub-meta"></div>
</div>

<div class="group-tabs" id="pub-tabs"></div>
<div class="content" id="pub-content"></div>
<div class="refresh-bar" id="pub-refresh"></div>

<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script src="js/rules.js"></script>
<script src="js/public.js"></script>
</body>
</html>
